<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>맥베스 시스템 — 그리드 1점 투시 턴제 전투</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        #game {
            position: fixed;
            /* padding 대신 top/right/bottom/left 로 컨테이너 자체 크기 축소.
               Phaser FIT 가 #game 실제 크기 기준으로 계산하므로 캔버스 overflow 방지. */
            top:    env(safe-area-inset-top, 0px);
            right:  env(safe-area-inset-right, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left:   env(safe-area-inset-left, 0px);
            display: flex;
            justify-content: center;
            /* 상단 정렬 — 데스크탑 세로로 긴 창에서 위쪽 letterbox 제거 */
            align-items: flex-start;
            touch-action: none;
        }

        #game canvas {
            display: block;
            box-shadow: 0 0 60px rgba(100, 80, 200, 0.4);
        }

        /* 회전 안내 — 기본은 숨김, 모바일 세로에서만 노출 */
        #rotate-prompt {
            display: none;
        }

        @media (orientation: portrait) and (max-width: 900px) {
            #rotate-prompt {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: fixed;
                inset: 0;
                z-index: 100;
                background: #000;
                color: #fff;
                text-align: center;
                gap: 22px;
                padding: 24px;
            }

            #rotate-prompt .icon {
                font-size: 72px;
                line-height: 1;
                transform-origin: center;
                animation: rotate-hint 2.6s ease-in-out infinite;
            }

            @keyframes rotate-hint {
                0%, 30%   { transform: rotate(0deg); }
                55%, 85%  { transform: rotate(-90deg); }
                100%      { transform: rotate(0deg); }
            }

            #rotate-prompt .title {
                font-size: 20px;
                font-weight: bold;
                color: #ffe066;
                text-shadow: 0 0 8px rgba(255, 224, 102, 0.3);
            }

            #rotate-prompt .sub {
                font-size: 13px;
                color: #888;
            }
        }
    </style>
</head>
<body>
<div id="game"></div>
<div id="rotate-prompt" role="alert" aria-live="polite">
    <div class="icon">📱</div>
    <p class="title">가로 모드로 회전해주세요</p>
    <p class="sub">Please rotate your device to landscape</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="battle.js"></script>
</body>
</html>
